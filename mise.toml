[tools]
python = "3.14.7"
ruff = "0.16.6"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install runtime dependencies"
run = "python -m pip install -r requirements.txt"

[tasks.inspector]
description = "Run Runtime Byte Inspector"
run = "python -m scripts"

[tasks.test]
description = "Run contract and Windows integration tests"
run = "python -m unittest discover -s tests -v"

[tasks.check]
description = "Check formatting, lint, and tests"
run = [
  "ruff format --check scripts tests",
  "ruff check scripts tests",
  "python -m unittest discover -s tests -v",
]

[tasks.format]
description = "Format Python source and tests"
run = "ruff format scripts tests"
